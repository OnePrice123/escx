# Свежий поток GDELT, пересчёт и публикация. Каждый час.
#
# ВАЖНО при приватном репозитории: бесплатных минут Actions там 2000 в месяц,
# а ежечасный прогон съедает примерно 1000-2000. Впритык.
# Если репозиторий приватный — поменяйте расписание на каждые 3 часа:
#     - cron: "7 */3 * * *"
# Точность индекса от этого почти не страдает: горизонты у нас месячные.
# У публичного репозитория минуты не ограничены, и ежечасный прогон уместен.
#
# База берётся из того же кэша, что и в daily: ключ общий, поэтому события,
# собранные здесь, доезжают до ночного пересчёта.
name: hourly
on:
  schedule:
    - cron: "7 * * * *"      # ежечасно; GDELT обновляется в :00/:15/:30/:45
  workflow_dispatch:

permissions:
  contents: write            # публикация витрины — это коммит в репозиторий

concurrency:
  group: pipeline            # тот же ключ, что у daily: одна база — один писатель
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: восстановить базу
        uses: actions/cache@v4
        with:
          path: ingest/escx.db
          key: escx-db-${{ github.run_id }}
          restore-keys: escx-db-

      - run: cd ingest && python -m escx.cli init
      # 5 срезов при часовом расписании — запас: нужно 4, лишние отсеются
      # по метке watermark и повторно скачаны не будут.
      - run: cd ingest && python -m escx.cli pull-gdelt --slices 5

      # Военная авиация из открытой сети ADS-B. Место здесь, а не в ночном
      # прогоне, по единственной причине: это СНИМОК «кто в воздухе сейчас»,
      # бэкфилла у него не существует в природе. Раз в сутки он поймал бы одну
      # случайную минуту, и ряд был бы бессмысленным; раз в час — набирается
      # суточный профиль, из которого уже видно отклонение от нормы зоны.
      #
      # Официальные и коммерческие ленты для этого не годятся: они исполняют
      # запросы на сокрытие бортов (в США — программа LADD), и первыми из них
      # пропадают именно разведчики, заправщики и правительственные рейсы.
      - name: снимок военной авиации
        continue-on-error: true          # сеть волонтёрская, падать из-за неё нельзя
        run: cd ingest && python -m escx.cli pull-adsb

      - name: пересчитать индикаторы и накал
        run: cd ingest && python -m escx.cli compute

      - run: cd ingest && python -m escx.cli status
      - run: python3 web/build.py --to-root

      # ПОЧЕМУ ПУБЛИКУЕМ ЕЖЕЧАСНО, А НЕ ЧАЩЕ.
      #
      # Упирается не в минуты Actions (у публичного репозитория их нет), а в
      # минуты сборки Cloudflare: 3000 в месяц, около 1.3 на деплой. Час даёт
      # 720 деплоев в месяц — вчетверо ниже потолка. Раз в десять минут дало бы
      # 4320 и потолок пробило.
      #
      # Но жёстче другое ограничение, содержательное: индикаторы считаются
      # скользящими окнами в 7 и 30 дней. Пятнадцатиминутный срез GDELT
      # сдвигает семидневное среднее примерно на 0.15% — на шкале 0-100 это
      # невидимо. Обновление раз в десять минут показывало бы ТО ЖЕ САМОЕ
      # число, то есть создавало бы видимость свежести без свежести.
      # Остальные источники интрадей не меняются вовсе: UCDP отстаёт на два
      # месяца, OFAC суточный, голосования ООН годовые.
      - name: опубликовать
        run: |
          mkdir -p data
          cp site/data/index.json data/latest.json
          git config user.name  "escx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "изменений нет — публиковать нечего"
            exit 0
          fi
          git commit -m "данные: $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Ночной прогон и заливки с рук идут в ту же ветку. Пока считали,
          # туда могли прилететь чужие коммиты — тогда push отклоняется как
          # non-fast-forward. Подтягиваем ребейзом и пробуем снова; -X theirs
          # означает «наша свежая сборка важнее того, что лежало до неё».
          for i in 1 2 3; do
            if git push; then
              echo "опубликовано"
              exit 0
            fi
            echo "push отклонён, подтягиваю чужие изменения (попытка $i)"
            git pull --rebase -X theirs origin "${{ github.ref_name }}"
          done
          echo "не удалось опубликовать после трёх попыток"
          exit 1
