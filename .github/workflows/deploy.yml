# Публикация статического сайта на GitHub Pages.
#
# Здесь раньше стояло: «если сайт на Cloudflare Pages, этот файл просто
# не сработает». Утверждение оказалось неверным и дорого обошлось: workflow
# срабатывал на каждом push, падал и слал письмо о падении. Предположение
# в комментарии — не то же самое, что проверенный факт.
#
# Почему это бесплатно: сайт не ходит в базу. Пайплайн считает всё заранее,
# build.py выгружает результат в JSON, и получается папка со статикой.
# Ни сервера, ни базы, ни бэкенда — платить не за что.
#
# Разовая настройка в репозитории:
#   Settings → Pages → Source: GitHub Actions
name: deploy

# ═══ ВЫКЛЮЧЕН ═══════════════════════════════════════════════════════════
# Автоматические запуски сняты 18 августа 2026. Причина: домен обслуживает
# Cloudflare Pages, а не GitHub Pages. Проверено прямым сравнением — brink.watch
# и escx.pages.dev отдают байт в байт одно и то же. То есть этот workflow
# публиковал туда, куда никто не смотрит.
#
# При этом он падал на КАЖДОМ push и слал письмо о падении: за одни сутки
# семнадцать писем. Падал закономерно — базы в кэше он не находит, а без базы
# сборка даёт пустой реестр, и шаг проверки её останавливает. Проверка верная,
# ненужным был сам прогон.
#
# Файл оставлен, а не удалён: если сайт когда-нибудь переедет на GitHub Pages,
# достаточно вернуть блок push/schedule. Запустить руками можно и сейчас.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      # База лежит в кэше, а не в артефакте. Раньше здесь стоял
      # download-artifact@v4 — он видит только артефакты СВОЕГО прогона и потому
      # молча, без ошибки, не находил ничего. Сборка каждый раз выходила без
      # базы и публиковала пустой реестр поверх посчитанной витрины.
      # Ключ тот же, что в daily.yml и hourly.yml.
      - name: восстановить базу из кэша ежедневного прогона
        uses: actions/cache/restore@v4
        with:
          path: ingest/escx.db
          key: escx-db-
          restore-keys: escx-db-

      # Без базы публиковать нельзя: build.py соберёт пустой реестр и затрёт им
      # витрину. Уронить прогон дешевле, чем показать «данные ещё не собраны»
      # на работающем индексе.
      - name: убедиться, что база на месте
        run: |
          if [ ! -s ingest/escx.db ]; then
            echo "::error::базы нет в кэше — публикация отменена, иначе выкатим пустой реестр"
            exit 1
          fi

      - name: собрать сайт
        run: python3 web/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
