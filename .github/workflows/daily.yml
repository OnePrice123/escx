# Ежедневный прогон: догрузить данные -> пересчитать -> собрать сайт.
#
# ПРО ХРАНЕНИЕ БАЗЫ. Раньше база передавалась между прогонами через artifact.
# Это не работало: actions/download-artifact@v4 видит только артефакты СВОЕГО
# прогона, а чтобы достать чужой, ему нужны run-id и токен. Молча, без ошибки,
# каждый запуск начинал с пустой базы — и накопления истории не происходило
# вообще. Теперь база лежит в кэше: actions/cache восстанавливает последнюю
# запись по префиксу ключа, и это его штатный режим, а не обходной приём.
#
# Кэш GitHub вычищает записи, к которым не обращались 7 дней. Прогон
# ежедневный, так что до этого не доходит. Но кэш — не архив: он может
# пропасть. Поэтому снимок витрины коммитится в репозиторий (шаг в конце),
# и полная история восстанавливается бэкфиллом за один прогон.
name: daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write        # нужно, чтобы коммитить снимок данных

concurrency:
  group: pipeline        # два прогона на одной базе — гонка и битый кэш
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: тесты до прогона, а не после
        run: |
          python3 ingest/tests/test_offline.py
          python3 ingest/tests/test_compute_offline.py
          python3 ingest/tests/test_llm_offline.py
          node api/test/test.mjs

      - name: восстановить базу
        uses: actions/cache@v4
        with:
          path: ingest/escx.db
          key: escx-db-${{ github.run_id }}
          restore-keys: escx-db-

      - run: cd ingest && python -m escx.cli init

      # Предварительные данные текущего года: месячный файл, открытый, без токена.
      # Финальный GED выходит раз в год, поэтому свежие события бывают только здесь.
      # Файл один и тот же в течение месяца — повторная загрузка ничего не портит,
      # ключ (source, source_id) отсекает уже записанное.
      - name: догрузить свежие данные UCDP
        run: cd ingest && python -m escx.cli pull-candidate

      # Если базы ещё нет (первый прогон, кэш пропал), тянем полную историю.
      # Проверка по числу событий, а не по наличию файла: пустая база — тоже
      # отсутствие истории.
      - name: подхватить историю, если база пуста
        run: |
          cd ingest
          N=$(python - <<'PY'
          from escx import db
          con = db.connect("escx.db")
          print(con.execute("SELECT COUNT(*) c FROM raw_events").fetchone()["c"])
          PY
          )
          echo "событий в базе: $N"
          if [ "$N" -lt 1000 ]; then
            echo "истории нет — загружаю полную выгрузку"
            python -m escx.cli load-ucdp
          fi

      # Доли населения, ВВП и военных расходов. Без них глобальный индекс не
      # считается вовсе. Меняются раз в год, но запрос дешёвый — берём каждый раз.
      - name: обновить веса последствий
        continue-on-error: true          # упал Всемирный банк — не повод ронять прогон
        run: cd ingest && python -m escx.cli pull-weights

      # Свежий GDELT прямо перед пересчётом.
      #
      # Раньше сбор GDELT жил ТОЛЬКО в почасовом прогоне, и ночной расчёт
      # полагался на то, что тот отработал и что база доехала через кэш. Любой
      # сбой в этой цепочке — и блок «инфополе» оказывается пустым, а покрытие
      # падает с 40 % до 20 %: остаётся одна кинетика из UCDP. Именно это и
      # было видно на витрине — «покрытие 20 %» у всех двадцати пар разом.
      #
      # Четыре среза — это последний час. История по-прежнему копится почасовым
      # прогоном, здесь мы лишь гарантируем, что у дня пересчёта инфополе есть.
      # Ключ (source, source_id) отсекает уже записанное, повтор безвреден.
      - name: догрузить свежий GDELT
        continue-on-error: true          # источник лёг — считаем на том, что есть
        run: cd ingest && python -m escx.cli pull-gdelt --slices 4

      # Если истории GDELT мало — добрать её самостоятельно, один раз.
      #
      # Почему это здесь, а не отдельной ручной кнопкой: GDELT — единственный
      # источник, покрывающий текущий год, а живёт его история только в кэше
      # Actions. Пока истории нет, накал у половины пар стоит ровно на 50,
      # дельты нулевые, а прокси насилия не набирает порог выборки. Требовать
      # ради этого ручного запуска значит держать сайт плоским до тех пор,
      # пока человек про это не вспомнит.
      #
      # Порог в 40 суток выбран по расчёту: опорная медиана требует минимум
      # восьми точек, окно инфополя семь дней, спарклайн девяносто. Сорок —
      # минимум, при котором числа перестают быть шумом.
      #
      # Повторов не будет: сутки помечаются в watermarks и пропускаются,
      # поэтому со второго прогона шаг стоит секунды.
      - name: добрать историю GDELT, если её мало
        continue-on-error: true
        run: |
          cd ingest
          DAYS=$(python - <<'PY'
          from escx import db
          con = db.connect("escx.db")
          r = con.execute("SELECT COUNT(DISTINCT occurred_at) c FROM raw_events "
                          "WHERE source='gdelt_export'").fetchone()
          print(r["c"] or 0)
          PY
          )
          echo "суток GDELT в базе: $DAYS"
          if [ "${DAYS:-0}" -lt 40 ]; then
            echo "истории мало — догружаю 120 суток"
            python -m escx.cli backfill-gdelt --start "$(date -u -d '120 days ago' +%Y-%m-%d)" --end "$(date -u -d '1 day ago' +%Y-%m-%d)"
          fi

      # Санкционные меры OFAC — экономический блок. Единственный источник в
      # пайплайне, который НЕ является медиапотоком: реестр мер, а не сообщения
      # о них. Поэтому он и добавляет информацию, а не переупаковывает GDELT.
      #
      # Зажигается только у пар с привязкой программ (config/sanctions_programs.json),
      # у остальных блок остаётся неизмеренным. Ноль означал бы «мер не вводили»,
      # а правда в том, что этим источником их канал не меряется вовсе.
      - name: догрузить санкционные меры
        continue-on-error: true          # Минфин США лёг — не повод ронять прогон
        run: cd ingest && python -m escx.cli pull-sanctions

      # Голосования Генассамблеи ООН — дипломатический блок. Такт годовой,
      # суточной динамики не даёт и не должен: он различает ПАРЫ между собой.
      # Иран и США расходятся на 4.0, Индия и Пакистан — на 0.02, воюя при этом.
      # Ни один медиапоток такого не скажет, и в этом весь смысл источника.
      #
      # Файл 70 МБ и меняется раз в год, поэтому запрос кэшируется, а не
      # выкачивается каждую ночь заново.
      - name: догрузить позиции в ООН
        continue-on-error: true
        run: cd ingest && python -m escx.cli pull-unvotes

      # Индекс геополитического риска — не слагаемое, а вторая пара глаз.
      # Инфополе целиком стоит на GDELT, и без независимого ряда мы не заметим,
      # если тот однажды изменит поведение. Сравнивать станет возможно, когда
      # у нашей стороны накопится хотя бы год общего периода.
      - name: догрузить GPR для сверки
        continue-on-error: true
        run: cd ingest && python -m escx.cli pull-gpr --since 2015-01

      - name: пересчитать индикаторы и накал
        run: cd ingest && python -m escx.cli compute

      - run: cd ingest && python -m escx.cli status
      - run: python3 web/build.py --to-root

      # Снимок витрины и собранный сайт кладём в репозиторий. Три причины:
      # 1. История индекса версионируется — тот же принцип, что append-only
      #    в базе: посмотреть, что мы показывали месяц назад, можно всегда.
      # 2. Cloudflare Pages в текущей настройке публикует корень репозитория,
      #    поэтому обновление сайта — это коммит, а не отдельный деплой.
      # 3. Коммит считается активностью репозитория. Без него GitHub отключает
      #    расписания после 60 дней тишины, и пайплайн молча встанет.
      - name: сохранить и опубликовать
        run: |
          mkdir -p data
          cp site/data/index.json data/latest.json
          git config user.name  "escx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "изменений нет — публиковать нечего"
            exit 0
          fi
          git commit -m "данные: снимок $(date -u +%Y-%m-%d)"
          # Пока прогон шёл (а он идёт минутами), в ветку могли прилететь чужие
          # коммиты — ваша заливка или соседний прогон. Тогда push отклоняется
          # как non-fast-forward, и вся работа пропадает на последнем шаге.
          # Поэтому: подтянуть чужое ребейзом и попробовать снова.
          #
          # -X theirs при ребейзе означает «наш коммит важнее»: стороны в ребейзе
          # переставлены местами. Для собранного сайта это и нужно — свежая
          # сборка обязана победить то, что лежало в репозитории до неё.
          for i in 1 2 3; do
            if git push; then
              echo "опубликовано"
              exit 0
            fi
            echo "push отклонён, подтягиваю чужие изменения (попытка $i)"
            git pull --rebase -X theirs origin "${{ github.ref_name }}"
          done
          echo "не удалось опубликовать после трёх попыток"
          exit 1
