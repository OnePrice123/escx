# Ежедневный прогон: догрузить данные -> пересчитать -> собрать сайт.
#
# ПРО ХРАНЕНИЕ БАЗЫ. Раньше база передавалась между прогонами через artifact.
# Это не работало: actions/download-artifact@v4 видит только артефакты СВОЕГО
# прогона, а чтобы достать чужой, ему нужны run-id и токен. Молча, без ошибки,
# каждый запуск начинал с пустой базы — и накопления истории не происходило
# вообще. Теперь база лежит в кэше: actions/cache восстанавливает последнюю
# запись по префиксу ключа, и это его штатный режим, а не обходной приём.
#
# Кэш GitHub вычищает записи, к которым не обращались 7 дней. Прогон
# ежедневный, так что до этого не доходит. Но кэш — не архив: он может
# пропасть. Поэтому снимок витрины коммитится в репозиторий (шаг в конце),
# и полная история восстанавливается бэкфиллом за один прогон.
name: daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write        # нужно, чтобы коммитить снимок данных

concurrency:
  group: pipeline        # два прогона на одной базе — гонка и битый кэш
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: тесты до прогона, а не после
        run: |
          python3 ingest/tests/test_offline.py
          python3 ingest/tests/test_compute_offline.py
          python3 ingest/tests/test_llm_offline.py
          node api/test/test.mjs

      - name: восстановить базу
        uses: actions/cache@v4
        with:
          path: ingest/escx.db
          key: escx-db-${{ github.run_id }}
          restore-keys: escx-db-

      - run: cd ingest && python -m escx.cli init

      # Предварительные данные текущего года: месячный файл, открытый, без токена.
      # Финальный GED выходит раз в год, поэтому свежие события бывают только здесь.
      # Файл один и тот же в течение месяца — повторная загрузка ничего не портит,
      # ключ (source, source_id) отсекает уже записанное.
      - name: догрузить свежие данные UCDP
        run: cd ingest && python -m escx.cli pull-candidate

      # Если базы ещё нет (первый прогон, кэш пропал), тянем полную историю.
      # Проверка по числу событий, а не по наличию файла: пустая база — тоже
      # отсутствие истории.
      - name: подхватить историю, если база пуста
        run: |
          cd ingest
          N=$(python - <<'PY'
          from escx import db
          con = db.connect("escx.db")
          print(con.execute("SELECT COUNT(*) c FROM raw_events").fetchone()["c"])
          PY
          )
          echo "событий в базе: $N"
          if [ "$N" -lt 1000 ]; then
            echo "истории нет — загружаю полную выгрузку"
            python -m escx.cli load-ucdp
          fi

      # Доли населения, ВВП и военных расходов. Без них глобальный индекс не
      # считается вовсе. Меняются раз в год, но запрос дешёвый — берём каждый раз.
      - name: обновить веса последствий
        continue-on-error: true          # упал Всемирный банк — не повод ронять прогон
        run: cd ingest && python -m escx.cli pull-weights

      - name: пересчитать индикаторы и накал
        run: cd ingest && python -m escx.cli compute

      - run: cd ingest && python -m escx.cli status
      - run: python3 web/build.py --to-root

      # Снимок витрины и собранный сайт кладём в репозиторий. Три причины:
      # 1. История индекса версионируется — тот же принцип, что append-only
      #    в базе: посмотреть, что мы показывали месяц назад, можно всегда.
      # 2. Cloudflare Pages в текущей настройке публикует корень репозитория,
      #    поэтому обновление сайта — это коммит, а не отдельный деплой.
      # 3. Коммит считается активностью репозитория. Без него GitHub отключает
      #    расписания после 60 дней тишины, и пайплайн молча встанет.
      - name: сохранить и опубликовать
        run: |
          mkdir -p data
          cp site/data/index.json data/latest.json
          git config user.name  "escx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "изменений нет — публиковать нечего"
            exit 0
          fi
          git commit -m "данные: снимок $(date -u +%Y-%m-%d)"
          # Пока прогон шёл (а он идёт минутами), в ветку могли прилететь чужие
          # коммиты — ваша заливка или соседний прогон. Тогда push отклоняется
          # как non-fast-forward, и вся работа пропадает на последнем шаге.
          # Поэтому: подтянуть чужое ребейзом и попробовать снова.
          #
          # -X theirs при ребейзе означает «наш коммит важнее»: стороны в ребейзе
          # переставлены местами. Для собранного сайта это и нужно — свежая
          # сборка обязана победить то, что лежало в репозитории до неё.
          for i in 1 2 3; do
            if git push; then
              echo "опубликовано"
              exit 0
            fi
            echo "push отклонён, подтягиваю чужие изменения (попытка $i)"
            git pull --rebase -X theirs origin "${{ github.ref_name }}"
          done
          echo "не удалось опубликовать после трёх попыток"
          exit 1
