name: daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write        # нужно, чтобы коммитить снимок данных

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: тесты до прогона, а не после
        run: |
          python3 ingest/tests/test_offline.py
          python3 ingest/tests/test_llm_offline.py
          node api/test/test.mjs

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: escx-db, path: ingest}

      - run: cd ingest && python -m escx.cli init

      - name: догрузить UCDP за последний месяц
        run: |
          cd ingest
          END=$(date -u +%Y-%m-%d)
          START=$(date -u -d '35 days ago' +%Y-%m-%d)
          python -m escx.cli backfill-ucdp --start "$START" --end "$END"

      - run: cd ingest && python -m escx.cli status
      - run: python3 web/build.py

      # Снимок витрины кладём в репозиторий. Две причины:
      # 1. История индекса версионируется — это тот же принцип, что append-only
      #    в базе: посмотреть, что мы показывали месяц назад, можно всегда.
      # 2. Коммит считается активностью репозитория. Без него GitHub отключает
      #    расписания после 60 дней тишины, и пайплайн молча встанет.
      - name: сохранить снимок витрины
        run: |
          mkdir -p data
          cp site/data/index.json data/latest.json
          git config user.name  "escx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "данные: снимок $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-artifact@v4
        with: {name: escx-db, path: ingest/escx.db, retention-days: 30, overwrite: true}
