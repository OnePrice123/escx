# Разовый исторический прогон. Запускается руками, кнопкой.
#
# Зачем он нужен отдельно. Накал — это отклонение от нормы, а норма считается
# по истории самой диады. Без истории нормы нет, и первое же число оказывается
# отклонением от самого себя, то есть ровно пятьюдесятью. Поэтому до первого
# осмысленного числа нужно один раз загрузить несколько лет UCDP.
#
# Где запускать: вкладка Actions -> backfill -> Run workflow. Даты можно
# оставить по умолчанию. Прогон занимает несколько минут: история берётся одной
# готовой выгрузкой (~50 МБ), а не сотнями запросов к API.
name: backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "отсечь события раньше этой даты (пусто = вся история с 1989)"
        default: "2015-01-01"
      end:
        description: "отсечь события позже этой даты (пусто = без ограничения)"
        default: ""

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: восстановить базу
        uses: actions/cache@v4
        with:
          path: ingest/escx.db
          key: escx-db-${{ github.run_id }}
          restore-keys: escx-db-

      # Проверка до работы. Если выгрузка недоступна или сменила номер версии,
      # это должно быть написано в первых строках лога, а не выясняться по
      # пустой базе через полчаса.
      - name: проверить доступность источника
        run: |
          cd ingest
          python - <<'PY'
          from escx.sources import ucdp
          v = ucdp.resolve_bulk_version()
          print("UCDP GED (открытая выгрузка):", v or "НЕДОСТУПНА")
          if not v:
              raise SystemExit("выгрузка UCDP недоступна — прогон бессмыслен")
          PY

      - run: cd ingest && python -m escx.cli init

      # Вся история одним файлом. Через API это было бы четыреста страничных
      # запросов — и с 2026 года ещё и токен, которого у нас нет: открытые
      # файлы дают ровно те же данные без него.
      - name: загрузить историю UCDP
        run: |
          cd ingest
          python -m escx.cli load-ucdp --start "${{ inputs.start }}" --end "${{ inputs.end }}"

      # Текущий год: финальный GED заканчивается прошлым годом, свежие месяцы
      # есть только в предварительной выгрузке. Она пересматривается задним
      # числом, поэтому лежит под отдельным источником и в обучение не идёт.
      - name: догрузить предварительные данные текущего года
        continue-on-error: true
        run: cd ingest && python -m escx.cli pull-candidate

      - name: веса последствий
        continue-on-error: true
        run: cd ingest && python -m escx.cli pull-weights

      - run: cd ingest && python -m escx.cli compute
      - run: cd ingest && python -m escx.cli status
      - run: python3 web/build.py --to-root

      - name: опубликовать
        run: |
          mkdir -p data
          cp site/data/index.json data/latest.json
          git config user.name  "escx-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "бэкфилл: история с ${{ inputs.start }}"
          git push
