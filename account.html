<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brink.watch</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="assets/styles.css?v=41">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="/" aria-label="brink.watch">
      <svg class="brand__glyph" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="bmg" gradientUnits="userSpaceOnUse" x1="34.5" y1="0" x2="75.4" y2="0">
            <stop class="s-ash" offset="0" stop-opacity=".28"/>
            <stop class="s-ember" offset=".55" stop-opacity=".72"/>
            <stop class="s-ember" offset="1"/>
          </linearGradient>
          <radialGradient id="bmh">
            <stop class="s-ember" offset="0" stop-opacity=".45"/>
            <stop class="s-ember" offset="1" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path d="M 34.50 76.85 A 31 31 0 1 1 75.39 32.22" fill="none" stroke="url(#bmg)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="75.4" cy="32.2" r="17.5" fill="url(#bmh)"/>
        <circle class="c-ember" cx="75.4" cy="32.2" r="5"/>
      </svg>
      <span class="brand__name">brink<span class="brand__dot">·</span>watch</span>
    </a>

    <div class="controls">
      <div class="langpick">
        <svg class="langpick__glyph" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M1.6 8h12.8M8 1.6c3.4 3.6 3.4 9.2 0 12.8M8 1.6c-3.4 3.6-3.4 9.2 0 12.8" fill="none" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        <select id="lang" aria-label="Language"></select>
      </div>
    </div>
  </div>
</header>

<main id="main" class="acc wrap">

  <!-- Вход и регистрация — одна форма в двух режимах. Два отдельных экрана
       заставляли бы человека выбирать до того, как он вспомнил, есть ли у него
       аккаунт; здесь он вводит адрес и пароль, а режим переключает ссылка. -->
  <section class="acc__box" id="auth" hidden>
    <h1 class="acc__title" id="authTitle"></h1>
    <p class="lede" id="authLede"></p>

    <form class="acc__form" id="authForm" novalidate>
      <label class="acc__label" for="email" data-i18n="accEmailLabel"></label>
      <input class="acc__input" id="email" name="email" type="email"
             autocomplete="email" inputmode="email" required placeholder="you@example.com">

      <label class="acc__label" for="password" data-i18n="accPasswordLabel"></label>
      <input class="acc__input" id="password" name="password" type="password"
             autocomplete="current-password" required minlength="10">

      <button class="acc__btn" type="submit" id="authBtn"></button>
    </form>

    <p class="acc__msg" id="authMsg" hidden></p>

    <div class="acc__links">
      <button class="acc__link" type="button" id="modeBtn"></button>
      <button class="acc__link" type="button" id="forgotBtn" data-i18n="accForgotLink"></button>
    </div>
    <p class="acc__fine" id="authFine" data-i18n="accFinePassword"></p>
    <!-- Согласие при регистрации. Показывается только в режиме регистрации:
         при входе человек соглашался уже тогда, и повторять — шум. -->
    <p class="acc__fine" id="authConsent" hidden><span data-i18n="accConsent"></span> <a href="terms.html" data-doc="terms" data-i18n="accConsentTerms"></a> <span data-i18n="accConsentAnd"></span> <a href="privacy.html" data-doc="privacy" data-i18n="accConsentPrivacy"></a>. <span data-i18n="accConsentTail"></span></p>
  </section>

  <!-- Зарегистрировался, но адрес не подтверждён. Отдельный экран, а не
       сообщение под формой: пока человек не откроет письмо, ему тут делать
       ровно одно действие, и оно должно быть единственным на экране. -->
  <section class="acc__box" id="pending" hidden>
    <h1 class="acc__title" data-i18n="accPendingTitle"></h1>
    <p class="lede"><span data-i18n="accPendingLede"></span> <span id="pendingEmail"></span>. <span data-i18n="accPendingLedeTail"></span></p>

    <div class="acc__actions">
      <button class="acc__btn" type="button" id="resendBtn" data-i18n="accResend"></button>
      <button class="acc__btn acc__btn--ghost" type="button" id="pendingBack" data-i18n="accBackToSignIn"></button>
    </div>

    <p class="acc__msg" id="pendingMsg" hidden></p>
    <p class="acc__fine" data-i18n="accPendingFine"></p>
  </section>

  <!-- Забытый пароль. Ответ здесь одинаков всегда — и для существующего
       адреса, и для незнакомого: иначе форма превращается в способ проверять,
       кто у нас зарегистрирован. -->
  <section class="acc__box" id="forgot" hidden>
    <h1 class="acc__title" data-i18n="accForgotTitle"></h1>
    <p class="lede" data-i18n="accForgotLede"></p>

    <form class="acc__form" id="forgotForm" novalidate>
      <label class="acc__label" for="forgotEmail" data-i18n="accEmailLabel"></label>
      <input class="acc__input" id="forgotEmail" name="email" type="email"
             autocomplete="email" inputmode="email" required placeholder="you@example.com">
      <button class="acc__btn" type="submit" id="forgotSubmit" data-i18n="accForgotSubmit"></button>
    </form>

    <p class="acc__msg" id="forgotMsg" hidden></p>
    <div class="acc__links">
      <button class="acc__link" type="button" id="backToAuth" data-i18n="accBackToSignIn"></button>
    </div>
  </section>

  <!-- Новый пароль по ссылке из письма. Экран показывается только если в
       адресе есть токен. -->
  <section class="acc__box" id="reset" hidden>
    <h1 class="acc__title" data-i18n="accResetTitle"></h1>
    <p class="lede" data-i18n="accResetLede"></p>

    <form class="acc__form" id="resetForm" novalidate>
      <label class="acc__label" for="resetPassword" data-i18n="accResetLabel"></label>
      <input class="acc__input" id="resetPassword" name="password" type="password"
             autocomplete="new-password" required minlength="10">
      <button class="acc__btn" type="submit" id="resetSubmit" data-i18n="accResetSubmit"></button>
    </form>

    <p class="acc__msg" id="resetMsg" hidden></p>
    <p class="acc__fine" data-i18n="accResetFine"></p>
  </section>

  <!-- Вошёл -->
  <section class="acc__box" id="cabinet" hidden>
    <h1 class="acc__title" data-i18n="accTitle"></h1>

    <dl class="acc__rows">
      <div><dt data-i18n="accEmailLabel"></dt><dd id="accEmail">—</dd></div>
      <div><dt data-i18n="accPlan"></dt><dd id="accPlan">—</dd></div>
      <div><dt data-i18n="accUntil"></dt><dd id="accUntil">—</dd></div>
      <div><dt data-i18n="accVerifiedRow"></dt><dd id="accVerified">—</dd></div>
    </dl>

    <label class="acc__check">
      <input type="checkbox" id="notifyBox">
      <span data-i18n="accNotifyLabel"></span>
    </label>
    <p class="acc__msg" id="notifyMsg" hidden></p>

    <div class="acc__actions">
      <a class="acc__btn acc__btn--ghost" href="/" data-i18n="accToBarometer"></a>
      <button class="acc__btn acc__btn--ghost" type="button" id="changeBtn" data-i18n="accChangePw"></button>
      <button class="acc__btn acc__btn--ghost" type="button" id="logoutBtn" data-i18n="accLogout"></button>
    </div>

    <form class="acc__form" id="changeForm" novalidate hidden>
      <label class="acc__label" for="oldPassword" data-i18n="accOldPassword"></label>
      <input class="acc__input" id="oldPassword" name="old_password" type="password"
             autocomplete="current-password" required>

      <label class="acc__label" for="newPassword" data-i18n="accNewPassword"></label>
      <input class="acc__input" id="newPassword" name="password" type="password"
             autocomplete="new-password" required minlength="10">

      <button class="acc__btn" type="submit" id="changeSubmit" data-i18n="accSave"></button>
    </form>
    <p class="acc__msg" id="changeMsg" hidden></p>

    <p class="acc__fine" id="accFine"></p>
  </section>

  <!-- Пока не знаем, вошёл или нет -->
  <section class="acc__box" id="loading">
    <p class="lede" data-i18n="accChecking"></p>
  </section>

  <!-- Бэкенд не отвечает. Показываем это прямо, а не пустой формой: человек
       иначе решит, что он ввёл не тот адрес. -->
  <section class="acc__box" id="offline" hidden>
    <h1 class="acc__title" data-i18n="accOfflineTitle"></h1>
    <p class="lede" data-i18n="accOfflineLede"></p>
    <div class="acc__actions"><a class="acc__btn acc__btn--ghost" href="/" data-i18n="accToBarometer"></a></div>
  </section>

</main>

<footer class="foot">
  <div class="wrap foot__in">
    <p class="foot__legal">© 2026 brink.watch
      <span class="sep">·</span> <a href="privacy.html" data-doc="privacy" data-i18n="footPrivacy"></a>
      <span class="sep">·</span> <a href="terms.html" data-doc="terms" data-i18n="footTerms"></a>
      <span class="sep">·</span> <a href="mailto:support@brink.watch">support@brink.watch</a>
    </p>
  </div>
</footer>

<script src="assets/i18n.js?v=41"></script>
<script src="assets/lang/eu.js?v=41"></script>
<script src="assets/lang/asia.js?v=41"></script>
<script src="assets/lang/rtl.js?v=41"></script>
<script src="assets/lang.js?v=41"></script>
<script src="assets/account.js?v=41"></script>
</body>
</html>
