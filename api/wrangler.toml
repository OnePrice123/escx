# ============================================================================
# ESCX API — Cloudflare Worker
#
# account_id намеренно не задан: у вас несколько аккаунтов Cloudflare, и жёстко
# вписанный идентификатор приведёт к развёртыванию не туда. wrangler определит
# аккаунт сам после входа, а при нескольких — спросит, в какой публиковать.
#
# Если захотите зафиксировать: account_id = "..." из адресной строки панели,
# это не секрет. Настоящие секреты кладутся только через wrangler secret put.
# ============================================================================
name = "escx-api"   # имя Worker; сайт живёт отдельно, в проекте Pages
main = "src/index.js"
compatibility_date = "2026-08-01"

# Бесплатный адрес вида escx-api.<ваш-поддомен>.workers.dev.
# Работает сразу, домен для запуска не нужен.
workers_dev = true

# Домен подключён — маршрут активен.
#
# ВНИМАНИЕ НА МЕСТО ЭТИХ СТРОК. Они обязаны стоять ДО первого заголовка секции.
# В TOML всё, что идёт после заголовка, принадлежит ему: routes после [vars]
# превращается в переменную окружения с именем routes, а после [[d1_databases]] —
# в поле привязки базы. Публикация в обоих случаях проходит успешно, Worker живёт
# на workers.dev, а на brink.watch/api/* приходит 404. Оба варианта тут уже были;
# распознать их можно по выводу wrangler deploy: строка «env.routes» среди
# переменных или предупреждение «Unexpected fields ... in d1_databases[0]».
routes = [
  { pattern = "brink.watch/api/*", zone_name = "brink.watch" }
]

[[d1_databases]]
binding = "DB"
database_name = "escx"
database_id = "084098f3-275b-4fa6-96a8-06e43ef6d096"

[vars]
# Адрес сайта. Worker ходит на него за витриной и делает редирект после входа.
SITE_URL = "https://brink.watch"
PROVIDER = "paddle"                    # paddle | stripe

# Служебные письма уходят с no-reply, а ответ на них должен попадать человеку,
# а не в никуда: MAIL_REPLY_TO — живой ящик. Как его завести — docs/08-mail.md.
MAIL_FROM = "no-reply@brink.watch"
MAIL_REPLY_TO = "support@brink.watch"

# Требовать подтверждённый адрес: и для входа, и для платных возможностей.
#
# Зачем: подписка приезжает из платёжки с адресом, а аккаунт на этот адрес мог
# завести кто угодно раньше настоящего владельца. Плюс адрес, на который не
# доходят письма, бесполезен и для уведомлений, и для восстановления пароля —
# лучше узнать об этом при регистрации, чем в день, когда человек забыл пароль.
#
# !!! ОТПРАВКА ПИСЕМ ПРИ ЭТОМ ОБЯЗАТЕЛЬНА. Со значением "1" и без рабочего
# RESEND_API_KEY никто не сможет ни зарегистрироваться, ни войти: письмо с
# ссылкой просто не уйдёт. Сначала почта по docs/08-mail.md, потом деплой.
# Временно отключить — поставить "0": вход снова начнёт работать без почты.
#
# Вход проверяется в src/auth.js (signIn), платный доступ — в src/entitlement.js,
# там же, где все остальные решения о доступе.
REQUIRE_VERIFIED_EMAIL = "1"

# Секреты — только так, в файл не попадают:
#   wrangler secret put PADDLE_WEBHOOK_SECRET
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put AUTH_PEPPER
#
# AUTH_PEPPER — перец для паролей, любая случайная строка на 32+ байта:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#
# Он несёт основную защиту паролей, потому что число итераций PBKDF2 упирается в
# лимит CPU бесплатного тарифа (см. шапку src/password.js). Утечка базы без перца
# не даёт перебирать пароли офлайн вообще.
#
# ПЕРЕЦ НЕ МЕНЯТЬ И НЕ ТЕРЯТЬ: он не хранится в базе, и после его потери ни один
# существующий пароль не подойдёт — всем придётся восстанавливать доступ письмом.
# Отсутствие перца не роняет Worker: он лишь пишет предупреждение в лог и
# хэширует без него, а первый вход после появления секрета пережмёт хэш сам.
