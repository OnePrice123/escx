# ============================================================================
# ESCX API — Cloudflare Worker
#
# account_id — не секрет. Он штатно лежит в конфиге и попадает в репозиторий;
# сам по себе доступа не даёт. Настоящие секреты кладутся отдельной командой
# (wrangler secret put) и в файлы не пишутся никогда.
# ============================================================================
name = "escx-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
account_id = "d3d70fb7f77e675557953e99450b7574"

# Бесплатный адрес вида escx-api.<ваш-поддомен>.workers.dev.
# Работает сразу, домен для запуска не нужен.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "escx"
database_id = "ЗАПОЛНИТ_setup.sh"

[vars]
# Пока домена нет — сюда идёт адрес сайта на Pages.
# Появится свой домен: заменить здесь и раскомментировать routes ниже.
SITE_URL = "https://escx.pages.dev"
PROVIDER = "paddle"                    # paddle | stripe
MAIL_FROM = "no-reply@escx.pages.dev"

# Раскомментировать, когда домен будет подключён к Cloudflare:
# routes = [
#   { pattern = "brink.watch/api/*", zone_name = "brink.watch" }
# ]

# Секреты — только так, в файл не попадают:
#   wrangler secret put PADDLE_WEBHOOK_SECRET
#   wrangler secret put RESEND_API_KEY
